name: Relentless CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  analysis:
    name: Full analysis (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: "2026.9.16"
          sha256: b6f8757201f6a2ee799f45f3f52ef7ca0b4071523637dc3b0b24264dd3333518
          install_args: --locked
          cache: false
          env: false
          github_token: ""
      - name: Full local command, including every mutant
        run: mise --yes --locked exec -- uv run --locked --group dev python -m quality.verify
      - name: Retain raw verification receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analysis-python-${{ matrix.python }}
          path: |
            .quality-results/tests.json
            .quality-results/*secrets.json
            .quality-results/dependencies.json
            .quality-results/static-security.json
            .quality-results/workflows-security.json
            .quality-results/mutation*.sqlite
            .quality-results/mutation-success-*/
            .quality-results/mutation-failure-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Installed behavior (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-24.04, macos-15, windows-2025]
        include:
          - os: ubuntu-24.04
            uv-checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          - os: macos-15
            uv-checksum: 8f7fbf1708399b921857bce71e1d60f0d3ccf52a30caebc1c1a2f175dce13ab6
          - os: windows-2025
            uv-checksum: 4e1278ede866be6c0bf32d2f466cc6de7a9fb399ecf20c9ce2d186e52424be47
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"
          checksum: ${{ matrix.uv-checksum }}
          enable-cache: false
          github-token: ""
      - name: Locked environment
        run: uv sync --locked --group dev
      - name: Reviewed runtime support and declared matrices
        run: uv run --locked --group dev python -m quality.runtime_support_main
      - name: Product unit, property and CLI behavior
        run: uv run --locked --group dev python -m pytest -q tests/test_intervals.py tests/test_properties.py tests/test_cli.py
      - name: Archives and both isolated installed consumers
        run: |
          mkdir -p .quality-results
          uv export --locked --only-group build --no-emit-project --no-header --no-annotate --quiet --output-file .quality-results/build-constraints.txt
          uv run --locked --group dev python -m quality.build_constraints_main
          uv run --locked --group dev python -m quality.package_main

  gate:
    name: Relentless CI gate
    if: ${{ always() }}
    needs: [analysis, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every matrix result
        env:
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: test "$ANALYSIS_RESULT" = success && test "$COMPATIBILITY_RESULT" = success
