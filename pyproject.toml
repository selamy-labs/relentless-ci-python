[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "relentless-ci-python"
version = "0.1.0"
description = "A strict, framework-neutral Python starting point"
requires-python = ">=3.11,<3.15"
license = "MIT"

[project.scripts]
relentless-example = "relentless_example.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relentless_example"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis>=6",
    "black>=25",
    "ruff>=0.12",
    "mypy>=1.16",
    "pyright>=1.1",
    "complexipy>=4",
    "vulture>=2",
    "cosmic-ray>=8.7.0",
    "deptry>=0.25.1",
    "grimp>=3.17",
    "packaging>=26.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src", "quality"]

[tool.coverage.report]
include_namespace_packages = true
fail_under = 100
show_missing = true

[tool.mypy]
strict = true

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests", "quality"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "ASYNC"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.deptry]
exclude = ["^$"]
known_first_party = ["quality", "tests"]
